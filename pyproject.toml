[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "logistics-backtester"
version = "0.1.0"
description = "Production-ready discrete-event backtesting platform for AI reverse-logistics decision policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Logistics Backtester Team" }
]
dependencies = [
  "simpy>=4.1.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "pandas>=2.2.0",
  "polars>=1.0.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "gymnasium>=0.29.1",
  "stable-baselines3>=2.3.2",
  "torch>=2.2.0",
  "ortools>=9.10.4067",
  "mlflow>=2.14.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.36.0",
  "plotly>=5.22.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pyyaml>=6.0.1",
  "fpdf2>=2.7.9",
  "httpx>=0.27.0",
  "gradio>=5.0.0",
  "google-genai>=3.2.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1.19",
  "sqlalchemy>=2.0.30",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.1",
  "types-PyYAML>=6.0.12",
  "nbformat>=5.10.4",
]

[project.scripts]
logisticsbt = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["notebooks", "app/dashboard"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
